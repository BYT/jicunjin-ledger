<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0B0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="积存金账本">
<title>积存金账本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0B0D12; --card:#141820; --line:#232A36;
    --gold:#D9B262; --gold2:#F2D79A;
    --txt:#EDEFF3; --sub:#98A1B0; --dim:#5D6675;
    --up:#E5544B; --down:#2FA36B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 0}

  .top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(145deg,#F2D79A,#C79A45);color:#241a06;font-weight:700;font-size:17px}
  h1{font-size:17px;margin:0;letter-spacing:.5px}
  .sub{font-size:11px;color:var(--dim);margin-top:2px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}

  /* 现价 */
  .price-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .px{font-size:44px;font-weight:700;line-height:1;letter-spacing:-1px;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#FFF3D6,#D9B262);-webkit-background-clip:text;background-clip:text;color:transparent}
  .px small{font-size:13px;color:var(--sub);font-weight:400;margin-left:6px;-webkit-text-fill-color:var(--sub)}
  .px-meta{font-size:11.5px;color:var(--dim);margin-top:8px}
  .edit-price{display:flex;gap:8px;margin-top:14px}
  .edit-price input{flex:1}

  input,select,button{font-family:inherit}
  input,select{
    width:100%;background:#0F1319;border:1px solid var(--line);border-radius:11px;
    color:var(--txt);padding:12px;font-size:15px;outline:none;
    appearance:none;-webkit-appearance:none}
  input::placeholder{color:#4C5564}
  input:focus,select:focus{border-color:#3B4658}
  button{border:none;border-radius:11px;font-size:15px;font-weight:600;padding:12px 16px;color:var(--txt);background:#1D2430}
  .btn-gold{background:linear-gradient(145deg,#F2D79A,#C79A45);color:#231a07}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--sub);font-size:13px;padding:10px 12px}
  button:active{transform:scale(.985);filter:brightness(.95)}

  /* 统计格 */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px}
  .cell{background:var(--card);padding:14px 14px 15px}
  .cell .k{font-size:11.5px;color:var(--sub);margin-bottom:7px}
  .cell .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .cell .v small{font-size:11px;color:var(--dim);font-weight:400;margin-left:3px}
  .cell .note{font-size:11px;color:var(--dim);margin-top:5px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--sub)}

  /* 市场参考价 */
  .mkt{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
    margin-top:14px;padding-top:13px;border-top:1px solid #1B212B}
  .mkt .l{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .mkt .v{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
  .mkt .v small{font-size:11px;color:var(--dim);font-weight:400;margin-left:3px}
  .mkt .r{font-size:11px;color:var(--dim);text-align:right;line-height:1.7}
  .pill{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:#4CC38A;border-color:rgba(76,195,138,.42)}
  .pill.bad{color:#C68A5E;border-color:rgba(198,138,94,.42)}

  /* 列表 */
  .card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .card-t{font-size:13px;color:var(--sub);letter-spacing:.3px}
  .tag{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid #1B212B;font-size:13.5px}
  .row:first-child{border-top:none}
  .row .l{color:var(--txt)}
  .row .l b{font-weight:600}
  .row .r{color:var(--sub);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px}
  .row .del{color:#6A7383;font-size:12px;padding:4px 6px;border-radius:6px}
  .side{display:inline-block;font-size:10px;padding:2px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
  .side.buy{background:rgba(217,178,98,.14);color:var(--gold)}
  .side.sell{background:rgba(47,163,107,.14);color:var(--down)}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:26px 0}

  /* 底部操作 */
  .dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(11,13,18,0),rgba(11,13,18,.92) 32%);
    display:flex;gap:10px;max-width:560px;margin:0 auto;z-index:20}
  .dock button{flex:1;padding:14px;font-size:15.5px}

  /* 表单弹层 */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:.22s;z-index:30}
  .sheet-bg.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#12161E;border-radius:22px 22px 0 0;
    border-top:1px solid var(--line);padding:8px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .28s cubic-bezier(.22,.9,.3,1);z-index:31;
    max-width:560px;margin:0 auto}
  .sheet.on{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:3px;background:#2A3342;margin:6px auto 14px}
  .seg{display:flex;background:#0F1319;border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;background:transparent;color:var(--sub);font-size:14px;padding:9px;border-radius:8px}
  .seg button.on{background:#1E2632;color:var(--txt)}
  .seg button.on.buy{background:rgba(217,178,98,.16);color:var(--gold2)}
  .seg button.on.sell{background:rgba(47,163,107,.16);color:#4CC38A}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:7px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .hintline{font-size:12px;color:var(--dim);margin:2px 0 12px;min-height:16px}
  .saveline{display:flex;gap:9px;margin-top:4px}
  .saveline .btn-gold{flex:1}
  .toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:#1B2129;border:1px solid var(--line);color:var(--txt);font-size:13px;padding:10px 16px;border-radius:10px;
    opacity:0;transition:.22s;z-index:40;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .foot{font-size:11px;color:#4B5462;line-height:1.7;text-align:center;padding:6px 8px 20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="mark">金</div>
      <div>
        <h1>积存金账本</h1>
        <div class="sub">手动记价 · 摊薄成本 · 已实现盈亏</div>
      </div>
    </div>
    <button class="btn-ghost" id="btnMenu">数据</button>
  </div>

  <!-- 现价 -->
  <div class="card">
    <div class="price-row">
      <div>
        <div class="px" id="px">—<small>元/克</small></div>
        <div class="px-meta" id="pxMeta">还没填今天的价</div>
      </div>
    </div>
    <div class="edit-price">
      <input id="pxInput" type="number" step="0.01" inputmode="decimal" placeholder="工行 App 当前积存价">
      <button class="btn-gold" id="pxSet">更新</button>
    </div>

    <div class="mkt">
      <div>
        <div class="l">市场参考 <span class="pill" id="refTag">连接中</span></div>
        <div class="v" id="refPx">—<small>元/克</small></div>
      </div>
      <div class="r" id="refNote">国际金价折算<br>非工行挂价</div>
    </div>
  </div>

  <!-- 持仓统计 -->
  <div class="stats">
    <div class="cell">
      <div class="k">持仓克数</div>
      <div class="v" id="vG">—<small>克</small></div>
      <div class="note" id="vGNote">买了还没记</div>
    </div>
    <div class="cell">
      <div class="k">摊薄成本</div>
      <div class="v" id="vAvg">—<small>元/克</small></div>
      <div class="note" id="vAvgNote">加权均价</div>
    </div>
    <div class="cell">
      <div class="k">浮动盈亏</div>
      <div class="v" id="vFloat">—<small>元</small></div>
      <div class="note" id="vFloatNote">按现价折算</div>
    </div>
    <div class="cell">
      <div class="k">已实现盈亏</div>
      <div class="v" id="vReal">0.00<small>元</small></div>
      <div class="note" id="vRealNote">卖出后落袋</div>
    </div>
    <div class="cell">
      <div class="k">累计投入</div>
      <div class="v" id="vCost">—<small>元</small></div>
      <div class="note">含买入手续费</div>
    </div>
    <div class="cell">
      <div class="k">合计盈亏</div>
      <div class="v" id="vTotal">—<small>元</small></div>
      <div class="note" id="vTotalNote">浮动 + 已实现</div>
    </div>
  </div>

  <!-- 流水 -->
  <div class="card">
    <div class="card-h"><div class="card-t">交易流水</div><span class="tag" id="cntTag">0 笔</span></div>
    <div id="list"><div class="empty">还没有记录，点下面「记一笔」</div></div>
  </div>

  <div class="foot">
    买入按加权平均摊薄；卖出按当时的摊薄成本结算，差额记已实现盈亏。<br>
    数据只存在这台手机上，清浏览器数据会丢，记得定期导出备份。
  </div>
</div>

<div class="dock">
  <button class="btn-gold" id="btnAdd">记一笔</button>
  <button id="btnSell">卖出</button>
</div>

<!-- 记一笔 -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="seg">
    <button id="segBuy" class="on buy">买入</button>
    <button id="segSell">卖出</button>
  </div>
  <div class="field">
    <label>成交价（元/克）</label>
    <input id="fPrice" type="number" step="0.01" inputmode="decimal" placeholder="例如 756.53">
  </div>
  <div class="field">
    <label id="fQtyLabel">成交克数</label>
    <div class="two">
      <select id="fUnit">
        <option value="g">按克数</option>
        <option value="y">按金额</option>
      </select>
      <input id="fQty" type="number" step="0.01" inputmode="decimal" placeholder="克数 / 金额">
    </div>
    <div class="hintline" id="fHint">按金额时自动折算克数，保留 4 位小数</div>
  </div>
  <div class="field">
    <label>手续费（可选）</label>
    <input id="fFee" type="number" step="0.01" inputmode="decimal" placeholder="留空按 0">
  </div>
  <div class="saveline">
    <button class="btn-ghost" id="btnCancel">取消</button>
    <button class="btn-gold" id="btnSave">保存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var K = 'gm_ledger_v1';
  var $ = function (id) { return document.getElementById(id); };
  var db = { price: null, priceAt: 0, trades: [] };
  var mode = 'buy';

  function fmt(n, d) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    d = d === undefined ? 2 : d;
    var s = Number(n).toFixed(d), p = s.split('.');
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return p.join('.');
  }
  function sgn(n, d) { return (n > 0 ? '+' : '') + fmt(n, d === undefined ? 2 : d); }
  function cls(n) { return n > 0 ? 'up' : (n < 0 ? 'down' : 'flat'); }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function hm(t) { var d = new Date(t); return p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }

  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(K) || 'null');
      if (o && Array.isArray(o.trades)) db = o;
    } catch (e) {}
  }
  function save() { try { localStorage.setItem(K, JSON.stringify(db)); } catch (e) {} }

  /* 按时间回放：加权平均法 */
  function calc() {
    var arr = db.trades.slice().sort(function (a, b) { return a.t - b.t; });
    var g = 0, cost = 0, realized = 0, sold = 0;
    for (var i = 0; i < arr.length; i++) {
      var t = arr[i];
      if (t.side === 'buy') {
        g += t.g; cost += t.g * t.p + (t.fee || 0);
      } else {
        var avg = g > 0 ? cost / g : 0;
        var sellG = Math.min(t.g, g);
        realized += (t.p - avg) * sellG - (t.fee || 0);
        cost -= avg * sellG;
        g -= sellG;
        sold += sellG;
      }
    }
    if (g < 1e-9) { g = 0; cost = 0; }
    return { g: g, cost: cost, avg: g > 0 ? cost / g : 0, realized: realized, sold: sold };
  }

  function render() {
    var s = calc(), px = db.price;
    renderRef();

    $('px').innerHTML = (px ? fmt(px, 2) : '—') + '<small>元/克</small>';
    $('pxMeta').textContent = px
      ? '你填于 ' + hm(db.priceAt) + '　·　点「更新」随时改'
      : '还没填今天的价';

    $('vG').innerHTML = s.g > 0 ? fmt(s.g, 4) + '<small>克</small>' : '0<small>克</small>';
    $('vGNote').textContent = s.g > 0 ? '已卖出 ' + fmt(s.sold, 4) + ' 克' : '买了还没记';

    $('vAvg').innerHTML = s.g > 0 ? fmt(s.avg, 2) + '<small>元/克</small>' : '—<small>元/克</small>';
    $('vAvgNote').textContent = s.g > 0 ? '含买入手续费' : '加权均价';

    if (s.g > 0 && px) {
      var fl = (px - s.avg) * s.g, flp = s.avg ? fl / (s.avg * s.g) * 100 : 0;
      $('vFloat').innerHTML = '<span class="' + cls(fl) + '">' + sgn(fl, 2) + '</span><small>元</small>';
      $('vFloatNote').textContent = sgn(flp, 2) + '%　回本价 ' + fmt(s.avg, 2);
    } else {
      $('vFloat').innerHTML = '—<small>元</small>';
      $('vFloatNote').textContent = s.g > 0 ? '先填现价' : '按现价折算';
    }

    $('vReal').innerHTML = '<span class="' + cls(s.realized) + '">' + sgn(s.realized, 2) + '</span><small>元</small>';
    $('vRealNote').textContent = s.sold > 0 ? '累计卖出 ' + fmt(s.sold, 4) + ' 克' : '卖出后落袋';

    $('vCost').innerHTML = s.cost > 0 ? fmt(s.cost, 2) + '<small>元</small>' : '0<small>元</small>';

    var total = s.realized + (s.g > 0 && px ? (px - s.avg) * s.g : 0);
    $('vTotal').innerHTML = '<span class="' + cls(total) + '">' + sgn(total, 2) + '</span><small>元</small>';
    $('vTotalNote').textContent = '浮动 + 已实现';

    /* 流水 */
    var list = $('list');
    $('cntTag').textContent = db.trades.length + ' 笔';
    if (!db.trades.length) {
      list.innerHTML = '<div class="empty">还没有记录，点下面「记一笔」</div>';
      return;
    }
    var arr = db.trades.slice().sort(function (a, b) { return b.t - a.t; });
    list.innerHTML = '';
    for (var i = 0; i < arr.length; i++) {
      var t = arr[i], r = document.createElement('div');
      r.className = 'row';
      r.innerHTML =
        '<div class="l"><span class="side ' + t.side + '">' + (t.side === 'buy' ? '买' : '卖') + '</span>' +
        '<b>' + fmt(t.p, 2) + '</b> × ' + fmt(t.g, 4) + ' 克' +
        (t.fee ? '<span style="color:#6A7383;font-size:11px">　含费 ' + fmt(t.fee, 2) + '</span>' : '') +
        '<span style="color:#5D6675;font-size:11px;display:block;margin-top:3px">' + hm(t.t) + '</span></div>' +
        '<div class="r">' + fmt(t.p * t.g, 2) + ' 元<span class="del" data-id="' + t.id + '">删</span></div>';
      list.appendChild(r);
    }
    var ds = list.querySelectorAll('.del');
    for (var j = 0; j < ds.length; j++) {
      ds[j].addEventListener('click', function () {
        var id = this.getAttribute('data-id');
        if (!confirm('删除这笔记录？')) return;
        db.trades = db.trades.filter(function (x) { return String(x.id) !== id; });
        save(); render(); toast('已删除');
      });
    }
  }

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('on'); }, 1800);
  }

  /* ---------- 市场参考价：国际金价实时折算 ---------- */
  var OZ = 31.1035, PREM = 1.015, ICBC_DEV = -12.85;
  var FX = 6.69, FX_AT = 0;
  var refPx = null, refAt = 0, refTimer = null;

  function refConv(usd, fx) { return usd * fx / OZ * PREM + ICBC_DEV; }

  function fetchFX() {
    return fetch('https://open.er-api.com/v6/latest/USD', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var v = d && d.rates && Number(d.rates.CNY);
        if (v > 0) { FX = v; FX_AT = Date.now(); }
      }).catch(function () {});
  }

  function fetchRef() {
    return fetch('https://api.gold-api.com/price/XAU', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var p = Number(d && d.price);
        if (!p || isNaN(p)) throw new Error('bad payload');
        refPx = refConv(p, FX); refAt = Date.now();
        renderRef();
      })
      .catch(function () {
        if (!refPx) {
          $('refTag').className = 'pill bad';
          $('refTag').textContent = '离线';
          $('refNote').innerHTML = '连不上数据源<br>手动填价照样能用';
        }
      });
  }

  function renderRef() {
    if (!refPx) return;
    $('refTag').className = 'pill ok';
    $('refTag').textContent = '实时';
    $('refPx').innerHTML = fmt(refPx, 2) + '<small>元/克</small>';
    if (db.price) {
      var gap = refPx - db.price, gp = gap / db.price * 100;
      var txt = '比你填的' + (gap >= 0 ? '高 ' : '低 ') + fmt(Math.abs(gap), 2) +
        '（' + sgn(gp, 2) + '%）';
      if (Math.abs(gp) > 0.8) {
        $('refTag').className = 'pill bad';
        $('refTag').textContent = '手动价偏了';
        txt += '<br>建议点上方更新一下';
      }
      $('refNote').innerHTML = txt + '<br>折算于 ' + hm(refAt);
    } else {
      $('refNote').innerHTML = '国际金价折算 · ' + hm(refAt) + '<br>非工行实时挂价';
    }
  }

  function startRef() {
    fetchRef();
    if (refTimer) clearInterval(refTimer);
    refTimer = setInterval(function () { if (!document.hidden) fetchRef(); }, 30000);
    setInterval(function () { if (!document.hidden) fetchFX(); }, 3600000);
  }

  /* 现价（手动） */
  $('pxSet').addEventListener('click', function () {
    var v = parseFloat($('pxInput').value);
    if (!v || isNaN(v) || v <= 0) { toast('价格填得不对'); return; }
    db.price = v; db.priceAt = Date.now(); save(); render();
    $('pxInput').value = '';
    toast('现价已更新 ' + fmt(v, 2) + ' 元/克');
  });
  $('pxInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('pxSet').click();
  });

  /* 弹层 */
  function openSheet(m) { setMode(m); $('sheet').classList.add('on'); $('sheetBg').classList.add('on'); }
  function closeSheet() { $('sheet').classList.remove('on'); $('sheetBg').classList.remove('on'); }
  function setMode(m) {
    mode = m;
    $('segBuy').className = 'on buy';
    $('segSell').className = '';
    if (m === 'sell') { $('segBuy').className = 'buy'; $('segSell').className = 'on sell'; }
    $('fQtyLabel').textContent = m === 'buy' ? '成交克数' : '卖出克数';
    $('fHint').textContent = m === 'buy'
      ? '按金额时自动折算克数，保留 4 位小数'
      : '按金额时按当前成交价折算克数';
    if (db.price && !$('fPrice').value) $('fPrice').value = db.price;
  }
  $('btnAdd').addEventListener('click', function () { $('fPrice').value = db.price || ''; openSheet('buy'); });
  $('btnSell').addEventListener('click', function () { $('fPrice').value = db.price || ''; openSheet('sell'); });
  $('segBuy').addEventListener('click', function () { setMode('buy'); });
  $('segSell').addEventListener('click', function () { setMode('sell'); });
  $('btnCancel').addEventListener('click', closeSheet);
  $('sheetBg').addEventListener('click', closeSheet);

  $('btnSave').addEventListener('click', function () {
    var p = parseFloat($('fPrice').value);
    var q = parseFloat($('fQty').value);
    var fee = parseFloat($('fFee').value) || 0;
    if (!p || isNaN(p) || p <= 0) { toast('成交价没填对'); return; }
    if (!q || isNaN(q) || q <= 0) { toast('克数 / 金额没填对'); return; }
    var g = $('fUnit').value === 'y' ? Math.round(q / p * 10000) / 10000 : Math.round(q * 10000) / 10000;

    if (mode === 'sell') {
      var s = calc();
      if (g > s.g + 1e-9) { toast('卖出 ' + fmt(g, 4) + ' 克，但只持有 ' + fmt(s.g, 4) + ' 克'); return; }
    }

    db.trades.push({ id: String(Date.now()) + Math.random().toString(36).slice(2, 5), side: mode, p: p, g: g, fee: fee, t: Date.now() });
    save(); render(); closeSheet();
    $('fPrice').value = ''; $('fQty').value = ''; $('fFee').value = '';
    toast(mode === 'buy' ? '已记买入 ' + fmt(g, 4) + ' 克' : '已记卖出 ' + fmt(g, 4) + ' 克');
  });

  /* 数据菜单 */
  $('btnMenu').addEventListener('click', function () {
    var c = '共 ' + db.trades.length + ' 笔记录。\n\n确定 = 导出备份（存成 json 文件）\n取消 = 关闭';
    if (confirm(c)) exportData();
  });

  function exportData() {
    var data = JSON.stringify(db, null, 2);
    try {
      var blob = new Blob([data], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '积存金账本_' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      toast('备份已导出');
    } catch (e) {
      try { navigator.clipboard.writeText(data); toast('已复制到剪贴板'); } catch (e2) { toast('导出失败'); }
    }
  }

  /* 启动 */
  load();
  render();
  fetchFX().then(startRef, startRef);
  $('px').addEventListener('click', function () {
    if (db.price) { $('pxInput').value = db.price; $('pxInput').focus(); }
  });

  /* Service Worker（http/https 下才生效，file:// 打开时静默跳过） */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
